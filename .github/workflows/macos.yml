name: macOS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Package Apple Silicon and Intel apps
        run: |
          python3 build_release.py artifacts/osx-arm64 --platform macos --runtime osx-arm64
          python3 build_release.py artifacts/osx-x64 --platform macos --runtime osx-x64
          ditto -c -k --keepParent artifacts/osx-arm64/ASN1Viewer.app artifacts/ASN1Viewer-osx-arm64.zip
          ditto -c -k --keepParent artifacts/osx-x64/ASN1Viewer.app artifacts/ASN1Viewer-osx-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ASN1Viewer-macOS
          path: artifacts/*.zip
