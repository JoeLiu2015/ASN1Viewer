name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.0.3

    - name: Build solution
      run: msbuild ASN1Viewer.sln /p:Configuration=Release

    - name: Run behavior baseline tests
      run: .\ASN1Viewer.Tests\bin\Release\ASN1Viewer.Tests.exe
